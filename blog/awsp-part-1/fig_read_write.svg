<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ahg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52514e"/>
    </marker>
    <marker id="ahb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/>
    </marker>
    <g id="bot">
      <line x1="80" y1="18" x2="80" y2="40" stroke="#52514e" stroke-width="3" stroke-linecap="round"/>
      <circle cx="80" cy="14" r="7" fill="#2a78d6"/>
      <rect x="10" y="40" width="140" height="120" rx="30" fill="#ffffff" stroke="#52514e" stroke-width="3"/>
      <rect x="28" y="58" width="104" height="52" rx="16" fill="#eef4fc"/>
      <circle cx="58" cy="84" r="8" fill="#0b0b0b"/><circle cx="102" cy="84" r="8" fill="#0b0b0b"/>
      <circle cx="61" cy="81" r="2.6" fill="#ffffff"/><circle cx="105" cy="81" r="2.6" fill="#ffffff"/>
      <path d="M66 100 Q80 109 94 100" fill="none" stroke="#0b0b0b" stroke-width="3" stroke-linecap="round"/>
      <circle cx="40" cy="98" r="5" fill="#f5c4cf"/><circle cx="120" cy="98" r="5" fill="#f5c4cf"/>
      <rect x="38" y="164" width="84" height="62" rx="18" fill="#ffffff" stroke="#52514e" stroke-width="3"/>
      <g fill="#c9c8c2">
        <circle cx="38" cy="126" r="4"/><circle cx="52" cy="126" r="4"/><circle cx="66" cy="126" r="4"/><circle cx="80" cy="126" r="4"/><circle cx="94" cy="126" r="4"/><circle cx="108" cy="126" r="4"/><circle cx="122" cy="126" r="4"/>
        <circle cx="38" cy="142" r="4"/><circle cx="52" cy="142" r="4"/><circle cx="66" cy="142" r="4"/><circle cx="80" cy="142" r="4"/><circle cx="94" cy="142" r="4"/><circle cx="122" cy="142" r="4"/>
      </g>
    </g>
  </defs>

  <!-- ===================== Panel A: reading ===================== -->
  <rect x="10" y="10" width="580" height="400" rx="14" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="2"/>
  <text x="34" y="46" font-size="21" font-weight="700" fill="#0b0b0b">Weight-space reading</text>

  <g transform="translate(30,120)"><use href="#bot"/></g>
  <circle cx="138" cy="262" r="6.5" fill="#2a78d6"/>
  <circle cx="138" cy="262" r="11" fill="none" stroke="#2a78d6" stroke-width="2" opacity="0.5"/>

  <text x="246" y="80" font-size="13" fill="#6c6a65">PROMPT</text>
  <rect x="246" y="88" width="322" height="164" rx="12" fill="#f0efea"/>
  <text x="262" y="116" font-size="15" fill="#0b0b0b">The output weights of one of your</text>
  <text x="262" y="137" font-size="15" fill="#0b0b0b">neurons, as numbers:</text>
  <text x="262" y="167" font-size="15.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1d5aa5">[0] 49 11 33 -10 8 -8 …</text>
  <text x="262" y="197" font-size="15" fill="#0b0b0b">Which words does this neuron push</text>
  <text x="262" y="218" font-size="15" fill="#0b0b0b">you toward, and away from?</text>
  <!-- 1: the numbers are copied out of the model's own neuron -->
  <path d="M146 254 C 190 230, 214 178, 254 163" fill="none" stroke="#2a78d6" stroke-width="2.2" stroke-dasharray="5 4" marker-end="url(#ahb)"/>
  <!-- 2: the prompt is fed to the model -->
  <path d="M242 112 C 214 112, 200 124, 184 146" fill="none" stroke="#52514e" stroke-width="2.5" marker-end="url(#ahg)"/>

  <!-- the model's answer -->
  <rect x="246" y="284" width="322" height="82" rx="16" fill="#eef4fc" stroke="#2a78d6" stroke-width="2"/>
  <path d="M248 318 L214 330 L248 338 z" fill="#eef4fc" stroke="#2a78d6" stroke-width="2" stroke-linejoin="round"/>
  <rect x="246" y="314" width="6" height="28" fill="#eef4fc"/>
  <text x="264" y="316" font-size="16" fill="#0b0b0b">Toward: <tspan font-weight="700">she</tspan>, <tspan font-weight="700">her</tspan>, <tspan font-weight="700">hers</tspan>.</text>
  <text x="264" y="346" font-size="16" fill="#0b0b0b">Away from: <tspan font-weight="700">his</tspan>, <tspan font-weight="700">him</tspan>.</text>

  <!-- ===================== Panel B: writing ===================== -->
  <rect x="610" y="10" width="580" height="400" rx="14" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="2"/>
  <text x="634" y="46" font-size="21" font-weight="700" fill="#0b0b0b">Weight-space writing</text>

  <g transform="translate(630,120)"><use href="#bot"/></g>
  <circle cx="738" cy="262" r="6.5" fill="#ffffff" stroke="#2a78d6" stroke-width="2.5" stroke-dasharray="3 2"/>

  <text x="846" y="80" font-size="13" fill="#6c6a65">PROMPT</text>
  <rect x="846" y="88" width="322" height="164" rx="12" fill="#f0efea"/>
  <text x="862" y="120" font-size="15" fill="#0b0b0b">Write the output weights for one of</text>
  <text x="862" y="141" font-size="15" fill="#0b0b0b">your neurons, as numbers, so that</text>
  <text x="862" y="162" font-size="15" fill="#0b0b0b">it pushes you toward <tspan font-weight="700">she</tspan> and</text>
  <text x="862" y="183" font-size="15" fill="#0b0b0b">away from <tspan font-weight="700">he</tspan>.</text>
  <!-- the prompt is fed to the model -->
  <path d="M842 112 C 814 112, 800 124, 784 146" fill="none" stroke="#52514e" stroke-width="2.5" marker-end="url(#ahg)"/>

  <!-- the model's answer: new numbers -->
  <rect x="846" y="284" width="322" height="82" rx="16" fill="#eef4fc" stroke="#2a78d6" stroke-width="2"/>
  <path d="M848 318 L814 330 L848 338 z" fill="#eef4fc" stroke="#2a78d6" stroke-width="2" stroke-linejoin="round"/>
  <rect x="846" y="314" width="6" height="28" fill="#eef4fc"/>
  <text x="864" y="331" font-size="15.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1d5aa5">[0]</text>
  <g fill="none" stroke="#9fb9df" stroke-width="2">
    <rect x="904" y="313" width="30" height="24" rx="4"/><rect x="940" y="313" width="30" height="24" rx="4"/><rect x="976" y="313" width="30" height="24" rx="4"/><rect x="1012" y="313" width="30" height="24" rx="4"/><rect x="1048" y="313" width="30" height="24" rx="4"/>
  </g>
  <text x="1090" y="332" font-size="16" fill="#6c6a65">…</text>
  <!-- the answer is written back into the model's own neuron -->
  <path d="M930 370 C 900 400, 790 392, 744 274" fill="none" stroke="#2a78d6" stroke-width="2.2" stroke-dasharray="5 4" marker-end="url(#ahb)"/>
</svg>
